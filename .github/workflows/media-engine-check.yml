name: Media Engine alpha checks
on:
  pull_request:
    paths:
      - 'media-engine/**'
      - '.github/workflows/media-engine-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: node --check media-engine/engine.mjs
      - run: MEDIA_RENDER_TEST=1 node --test media-engine/engine.test.mjs
